<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Verification Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 10px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .otp {
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${subject}">Verification Code</h1>
    <p class="greeting" th:text="'Hello ' + ${username} + ','"></p>
    <p>Please use the following OTP to confirm your email:</p>
    <div class="otp"><span th:text="${otp}"></span></div>
    <p th:text="'The OTP will expire after ' + ${expirationMinutes} + ' minutes!'">The OTP will expire after 15 minutes!</p>
    <div class="footer">
        <p>ELINGO - Language Learning System</p>
    </div>
</div>
</body>
</html>
