server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: elingo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    host: ${MAIL_HOST}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true # Bật tính năng xác thực người dùng (phải cung cấp username, password)
          starttls:
            enable: true # Bật cơ chế bảo mật STARTTLS (kết nối mã hóa an toàn (TLS))


jwt:
  signerKey: ${JWT_SIGNER_KEY}
  accessTokenTime: 15 # minute
  refreshTokenTime: 14 # day

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha