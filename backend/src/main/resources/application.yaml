server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: elingo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    properties:
      mail:
        smtp:
          auth: true # Bật tính năng xác thực người dùng (phải cung cấp username, password)
          starttls:
            enable: true # Bật cơ chế bảo mật STARTTLS (kết nối mã hóa an toàn (TLS))

jwt:
  access-token-time: 15 # minute
  refresh-token-time: 14 # day

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  thread-pool:
    scheduler:
      default-pool-size: 2
      battle-pool-size: 2
    async:
      email:
        core-pool-size: 1
        max-pool-size: 2
        queue-capacity: 50
      gamification:
        core-pool-size: 1
        max-pool-size: 2
        queue-capacity: 100
  community:
    moderation:
      openai-model: omni-moderation-latest
      openai-base-url: https://api.openai.com # OpenAI SDK
      scheduler:
        fixed-delay-seconds: 30
        batch-size: 5
        maxAttempts: 3
      policy:
        auto-reject-threshold: 0.7
        review-threshold: 0.5
        video-max-frames: 12
  otp:
    expiration-minutes: 15
  flashcard:
    srs:
      ef-min: 1.3
      again-ef-penalty: 0.32
      hard-ef-penalty: 0.14
      easy-ef-bonus: 0.1
      hard-interval-factor: 1.2
      easy-interval-factor: 1.3
      again-review-minutes: 10
    user-deck-limit:
      max-decks-per-user: 5
      max-topics-per-deck: 15
      max-cards-per-topic: 50
  gamification:
    rules:
      FLASHCARD_REVIEW:   { xp: 2,  daily-limit: 100 }
      LESSON_DICTATION:   { xp: 20, daily-limit: 10 }
      SEGMENT_DICTATION:  { xp: 3,  daily-limit: 50 }
      LESSON_SHADOWING:   { xp: 20, daily-limit: 10 }
      SEGMENT_SHADOWING:  { xp: 3,  daily-limit: 50 }
      BATTLE_WIN:         { xp: 30, daily-limit: 10 }
      BATTLE_LOSE:        { xp: 10, daily-limit: 10 }
      DAILY_CHECKIN:      { xp: 5,  daily-limit: 1 }
  lesson:
    dictation-pass-score: 60
    shadowing-pass-score: 55
    dictation-attempt-penalty: 5
    shadowing-attempt-penalty: 10
  premium:
    scheduler:
      expire-cron: 0 0 * * * *
      cancel-tx-cron: 0 */30 * * * *
  battle:
    total-rounds: 10
    question-time-ms: 15000
    countdown-ms: 3000
    round-gap-ms: 2500
    queue-timeout-ms: 60000
    reconnect-grace-ms: 15000
    room-ttl-ms: 600000
    min-correct-for-xp: 3
    min-cards-required: 10
    answer-grace-ms: 300
