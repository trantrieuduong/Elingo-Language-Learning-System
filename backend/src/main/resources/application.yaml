server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: elingo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    properties:
      mail:
        smtp:
          auth: true # Bật tính năng xác thực người dùng (phải cung cấp username, password)
          starttls:
            enable: true # Bật cơ chế bảo mật STARTTLS (kết nối mã hóa an toàn (TLS))
  data:
    web:
      pageable:
        one-indexed-parameters: true
        max-page-size: 100

jwt:
  access-token-time: 15 # minute
  refresh-token-time: 14 # day

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  mail:
    from: "Elingo <no-reply@elingo.pro>"
  thread-pool:
    scheduler:
      default-pool-size: 2
      battle-pool-size: 2
      speaking-pool-size: 2
    async:
      app:
        core-pool-size: 2
        max-pool-size: 4
        queue-capacity: 200
      email:
        core-pool-size: 1
        max-pool-size: 2
        queue-capacity: 50
      gamification:
        core-pool-size: 1
        max-pool-size: 2
        queue-capacity: 100
  community:
    moderation:
      scheduler:
        fixed-delay-seconds: 30
        batch-size: 5
        maxAttempts: 3
      policy:
        auto-reject-threshold: 0.7
        review-threshold: 0.5
        video-max-frames: 12
  otp:
    expiration-minutes: 15
  flashcard:
    srs:
      ef-min: 1.3
      again-ef-penalty: 0.32
      hard-ef-penalty: 0.14
      easy-ef-bonus: 0.1
      hard-interval-factor: 1.2
      easy-interval-factor: 1.3
      again-review-minutes: 10
    user-deck-limit:
      max-decks-per-user: 5
      max-topics-per-deck: 15
      max-cards-per-topic: 50
  lesson:
    dictation-pass-score: 60
    shadowing-pass-score: 55
    dictation-attempt-penalty: 5
    shadowing-attempt-penalty: 10
  premium:
    scheduler:
      expire-cron: 0 0 * * * *
      cancel-tx-cron: 0 */30 * * * *
      expiring-cron: 0 0 8 * * *
  battle:
    total-rounds: 10
    question-time-ms: 15000
    countdown-ms: 3000
    round-gap-ms: 2500
    queue-timeout-ms: 60000
    reconnect-grace-ms: 15000
    room-ttl-ms: 600000
    min-correct-for-xp: 3
    min-cards-required: 10
    answer-grace-ms: 300
  speaking:
    default-max-participants: 4
    max-participants-limit: 4
    signal-max-payload-bytes: 6144
    reconnect-grace-ms: 20000
    host-reconnect-grace-ms: 300000
    waiting-room-ttl-ms: 900000
    cleanup-interval-ms: 60000
    stun-urls:
      - stun:stun.l.google.com:19302
