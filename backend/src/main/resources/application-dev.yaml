app:
  front-end-domain: "http://localhost:5173"
  google:
    client-id: ${DEV_GOOGLE_CLIENT_ID}

spring:
  datasource:
    url: ${DEV_MYSQL_CONNECTION_URL:jdbc:mysql://localhost:3306/elingo}
    username: ${DEV_MYSQL_USERNAME}
    password: ${DEV_MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${DEV_MAIL_HOST}
    port: ${DEV_MAIL_PORT}
    username: ${DEV_MAIL_USERNAME}
    password: ${DEV_MAIL_PASSWORD}

jwt:
  signer-key: ${DEV_JWT_SIGNER_KEY}

r2:
  account-id: ${DEV_R2_ACCOUNT_ID}
  access-key: ${DEV_R2_ACCESS_KEY}
  secret-key: ${DEV_R2_SECRET_KEY}
  bucket: ${DEV_R2_BUCKET}
  public-url: ${DEV_R2_PUBLIC_URL:http://localhost:8787}
  max-file-size-bytes: 104857600
  multipart-min-part-size: 5242880
  presign-duration-minutes: 30

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.elingo: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%X{requestId:-}]){yellow} %clr(%-30logger{30}){cyan} : %msg%n%wEx"