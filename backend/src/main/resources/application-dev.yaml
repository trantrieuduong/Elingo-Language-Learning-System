app:
  front-end-domain: "http://localhost:5173"

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/elingo
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.elingo: DEBUG
    org.hibernate.SQL: DEBUG