app:
  front-end-domain: "http://localhost:5173"
  google:
    client-id: ${DEV_GOOGLE_CLIENT_ID}
  premium:
    bank-transfer:
      code-prefix: ${DEV_BANK_TRANSFER_CODE_PREFIX:ELGO}
      bank-name: ${DEV_BANK_NAME}
      bank-account: ${DEV_BANK_ACCOUNT}
      bank-account-name: ${DEV_BANK_ACCOUNT_NAME}
      qr-template: ${DEV_BANK_TRANSFER_QR_TEMPLATE:compact}
    sepay:
      secret-key: ${DEV_SEPAY_WEBHOOK_SECRET}
  community:
    moderation:
      openai-api-key: ${DEV_OPENAI_API_KEY}
      scheduler:
        enabled: ${DEV_MODERATION_SCHEDULER_ENABLED:false}
      moderation-service:
        base-url: ${DEV_MODERATION_SERVICE_URL:http://localhost:8000/v1/moderate/text}
        token: ${DEV_MODERATION_SERVICE_TOKEN:}
  ffmpeg:
    path: ${DEV_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${DEV_FFPROBE_PATH:ffprobe}
    max-concurrent: ${DEV_MAX_CONCURRENT:3}

spring:
  datasource:
    url: ${DEV_MYSQL_CONNECTION_URL:jdbc:mysql://localhost:3306/elingo} #?connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true
    username: ${DEV_MYSQL_USERNAME}
    password: ${DEV_MYSQL_PASSWORD}
  data:
    web:
      pageable:
        one-indexed-parameters: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
  mail:
    host: ${DEV_MAIL_HOST}
    port: ${DEV_MAIL_PORT}
    username: ${DEV_MAIL_USERNAME}
    password: ${DEV_MAIL_PASSWORD}

jwt:
  signer-key: ${DEV_JWT_SIGNER_KEY}

r2:
  account-id: ${DEV_R2_ACCOUNT_ID}
  access-key: ${DEV_R2_ACCESS_KEY}
  secret-key: ${DEV_R2_SECRET_KEY}
  bucket: ${DEV_R2_BUCKET}
  public-url: ${DEV_R2_PUBLIC_URL:http://localhost:8787}
  multipart-min-part-size: 5242880
  presign-duration-minutes: 30

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.elingo: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%X{requestId:-}]){yellow} %clr(%X{userId:-}){magenta} %clr(%-30logger{30}){cyan} : %msg%n%wEx"
