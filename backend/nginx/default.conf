# Đặt tại /opt/elingo/nginx/default.conf
# Kiến trúc: Client -> Cloudflare (proxy, HTTPS) -> Nginx (443, Origin Certificate) -> backend:8080
# Chứng chỉ: /opt/elingo/certs/origin.pem và origin.key (Cloudflare Origin Certificate)

# ---------------------------------------------------------------------------
# Lấy IP thật của client từ Cloudflare (chỉ tin header khi request đến từ IP của Cloudflare)
# Danh sách: https://www.cloudflare.com/ips (cập nhật nếu Cloudflare thay đổi)
# ---------------------------------------------------------------------------
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Chặn truy cập trực tiếp bằng IP hoặc Host lạ
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.elingo.pro;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS: api.elingo.pro -> Spring Boot
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.elingo.pro;

    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $backend http://backend:8080;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (STOMP)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}